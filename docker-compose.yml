services:
  postgres:
    image: postgres:17
    container_name: eureka-db
    ports:
      - "${EUREKA_DB_PORT:-5455}:5432"
    environment:
      POSTGRES_DB: eureka
      POSTGRES_USER: eureka
      POSTGRES_PASSWORD: eureka1234
    volumes:
      - eureka-data:/var/lib/postgresql/data

volumes:
  eureka-data:
